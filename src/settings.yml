---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version:
serverless_language:
refresh_interval_floor:
polling_url: https://trmnl.com/api/plugin_settings/{{ calendar_plugin_id }}/data
polling_headers: authorization=bearer {{ api_key }}
polling_body: ''
id: 501012
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: about_kalender
  field_type: author_bio
  name: Om pluginen
  category: calendar,productivity
  learn_more_url: https://docs.trmnl.com/go/private-api/plugin-data
  description: Läser händelser från din inbyggda TRMNL-kalender via <a href="https://docs.trmnl.com/go/private-api/plugin-data" class="underline">TRMNL:s plugin-data-API</a>.
- keyname: calendar_plugin_id
  field_type: string
  name: Kalender-pluginens ID
  description: Lägg först till TRMNL:s vanliga kalender-plugin (Google, Apple, Outlook …) och välj dina kalendrar. ID:t är siffran i adressen när du redigerar den, t.ex. /plugin_settings/12345/edit. Den behöver inte ligga i spellistan.
  placeholder: '12345'
- keyname: api_key
  field_type: password
  name: API-nyckel
  description: Konto-API-nyckel med läsbehörighet, skapas under Account → API. Skriv demo för att visa exempeldata.
- keyname: days_ahead
  field_type: number
  name: Dagar framåt
  default: 7
name: Kalender – idag och kommande vecka
description: Dagens händelser och 7 dagar
refresh_interval: 15
